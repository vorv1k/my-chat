<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с Nitro & Модерацией</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:ital,wght@0,400;0,700;1,400&family=Orbitron:wght@600;800&family=Pacifico&family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-chat: rgba(18, 18, 28, 0.85);
            --bg-input: rgba(30, 30, 42, 0.85);
            --text-main: #f5f5f7;
            --text-muted: #a1a1aa;
            --accent-primary: #00f2fe;
            --accent-secondary: #4facfe;
            --border-color: rgba(255, 255, 255, 0.1);
            --grad-angle: 90deg;
            --grad-speed: 3s;
        }

        /* 🎭 Nitro Рамки */
        .frame-none { border: 2px solid var(--border-color); }
        .frame-neon { border: 3px solid #00f2fe !important; box-shadow: 0 0 12px #00f2fe; }
        .frame-rainbow { 
            border: 3px solid transparent !important; 
            background: linear-gradient(#111, #111) padding-box, linear-gradient(var(--grad-angle, 45deg), red, yellow, green, cyan, blue, magenta) border-box; 
        }
        .frame-fire { border: 3px solid #ff4500 !important; box-shadow: 0 0 14px #ff4500, 0 0 20px #ff8c00; }
        .frame-gold { border: 3px solid #ffd700 !important; box-shadow: 0 0 12px #ffd700; }

        /* 🌈 Динамический перелив никнейма */
        .gradient-text {
            background-size: 200% auto !important;
            color: transparent !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            animation: moveGradient var(--grad-speed, 3s) linear infinite !important;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Background */
        body {
            background: radial-gradient(circle at 50% 50%, #1a102f 0%, #08080c 100%);
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; font-family: 'Roboto', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* 🚀 Баннеры */
        .ad-banner-container.discord, .ad-banner-container.aviasales {
            position: fixed; left: -350px; width: 260px;
            border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); z-index: 9999;
            overflow: hidden; transition: left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
        }
        .ad-banner-container.discord { top: 20px; aspect-ratio: 1.5 / 1; }
        .ad-banner-container.aviasales { top: 210px; aspect-ratio: 2 / 1; }
        .ad-banner-container.show { left: 20px; }
        .ad-banner-img { width: 100%; height: 100%; object-fit: cover; }

        .ad-close-btn {
            position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.7);
            color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px;
            font-size: 11px; cursor: pointer; display: flex; justify-content: center; align-items: center;
        }

        /* Кнопки */
        .glow-button {
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            color: #000; border: none; border-radius: 14px; cursor: pointer;
            font-weight: bold; padding: 10px 20px; transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }
        .glow-button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6); }

        .btn-nitro {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #fff; border: none; border-radius: 12px; cursor: pointer;
            font-weight: bold; padding: 7px 16px; font-size: 0.82rem;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4); transition: all 0.25s ease;
        }
        .btn-nitro:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(255, 0, 127, 0.7); }

        .btn-apply {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #000; border: none; border-radius: 14px; cursor: pointer;
            font-weight: bold; padding: 12px 20px; font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(0, 230, 118, 0.4); transition: all 0.3s ease;
            width: 100%; margin-top: 15px; display: none;
            animation: pulseBtn 1.5s infinite alternate;
        }
        @keyframes pulseBtn {
            from { box-shadow: 0 0 10px rgba(0, 230, 118, 0.3); }
            to { box-shadow: 0 0 25px rgba(0, 230, 118, 0.8); }
        }

        .btn-small {
            background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 6px 14px; border-radius: 10px; cursor: pointer; font-size: 0.8rem;
            transition: all 0.2s; backdrop-filter: blur(8px);
        }
        .btn-small:hover { background: rgba(255, 255, 255, 0.2); }

        /* Модальные окна */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); display: flex; justify-content: center;
            align-items: center; z-index: 1000; backdrop-filter: blur(12px);
        }

        .modal {
            background: var(--bg-chat); padding: 25px; border-radius: 24px;
            width: 460px; border: 1px solid var(--border-color); text-align: center;
            max-height: 90vh; overflow-y: auto; position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .modal input, .modal select, .modal textarea {
            width: 100%; padding: 10px 14px; margin: 6px 0 12px 0; border-radius: 12px;
            border: 1px solid var(--border-color); background: var(--bg-input); color: #fff; outline: none;
            font-size: 0.85rem;
        }

        .modal textarea { resize: none; height: 60px; }

        /* Контейнер Чата */
        .chat-container {
            width: 100%; max-width: 850px; height: 92vh; background: var(--bg-chat);
            backdrop-filter: blur(20px); border-radius: 28px; display: flex;
            flex-direction: column; border: 1px solid var(--border-color);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        .chat-header {
            padding: 18px 24px; background: rgba(10, 10, 18, 0.5);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); border-radius: 28px 28px 0 0;
        }

        .chat-messages {
            flex: 1; padding: 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
        }

        /* Сообщения */
        .message {
            max-width: 78%; padding: 12px 16px; border-radius: 20px;
            background: var(--bg-input); align-self: flex-start; word-wrap: break-word;
            border: 1px solid rgba(255, 255, 255, 0.05); display: flex; gap: 12px; align-items: flex-start;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .message.my-message {
            background: linear-gradient(135deg, rgba(30, 45, 70, 0.85), rgba(18, 22, 38, 0.95));
            align-self: flex-end; border: 1px solid rgba(0, 242, 254, 0.25); flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 44px; height: 44px; border-radius: 50%; object-fit: cover; cursor: pointer;
            flex-shrink: 0; background: #222; transition: transform 0.2s;
        }
        .msg-avatar:hover { transform: scale(1.08); }

        .msg-content { flex: 1; }
        .message-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .message.my-message .message-header { justify-content: flex-end; }

        .message .username { 
            font-size: 0.88rem; font-weight: bold; color: var(--accent-primary); 
            display: flex; align-items: center; gap: 6px; cursor: pointer; 
        }

        .msg-time { font-size: 0.68rem; color: var(--text-muted); margin-left: 4px; }

        .nitro-badge { 
            background: linear-gradient(135deg, #ff007f, #7928ca); color: #fff; 
            font-size: 0.65rem; padding: 2px 7px; border-radius: 6px; font-weight: bold;
            box-shadow: 0 0 10px rgba(255,0,127,0.4);
        }

        .chat-input-area {
            padding: 16px; background: rgba(10, 10, 18, 0.6);
            border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; position: relative;
            border-radius: 0 0 28px 28px;
        }

        .chat-input-area input[type="text"] {
            flex: 1; padding: 12px 18px; border-radius: 20px;
            border: 1px solid var(--border-color); background: var(--bg-input); color: #fff; outline: none;
        }

        .btn-emoji-icon {
            background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color);
            border-radius: 50%; width: 42px; height: 42px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.2s ease; outline: none;
        }
        .btn-emoji-icon img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
        .btn-emoji-icon:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.08); }

        .emoji-picker {
            position: absolute; bottom: 75px; left: 16px; background: rgba(20, 20, 32, 0.95);
            border: 1px solid var(--border-color); border-radius: 20px; padding: 14px;
            display: none; grid-template-columns: repeat(6, 1fr); gap: 10px; z-index: 100; max-height: 240px; overflow-y: auto;
            backdrop-filter: blur(16px); box-shadow: 0 12px 35px rgba(0,0,0,0.6);
        }
        .emoji-picker span, .emoji-picker img { cursor: pointer; font-size: 1.4rem; text-align: center; transition: transform 0.15s; }
        .emoji-picker span:hover, .emoji-picker img:hover { transform: scale(1.25); }

        /* Профиль */
        .profile-card {
            width: 100%; border-radius: 20px; overflow: hidden; background: rgba(15, 15, 22, 0.9); border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .profile-banner {
            height: 110px; background: linear-gradient(45deg, #222, #444); background-size: cover; background-position: center;
        }
        .profile-avatar-container { position: relative; margin-top: -45px; text-align: center; }
        .profile-avatar { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; background: #222; }
        .profile-info { padding: 16px; text-align: center; }
        .profile-username { font-size: 1.2rem; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 6px; }
        .profile-bio { font-size: 0.88rem; color: var(--text-muted); margin-top: 8px; font-style: italic; }

        .draft-notice {
            background: rgba(255, 179, 0, 0.15); border: 1px solid #ffb300; color: #ffca28;
            padding: 8px 12px; border-radius: 12px; font-size: 0.78rem; margin-top: 10px; display: none;
        }

        .gradient-controls {
            background: rgba(255, 255, 255, 0.03); padding: 10px; border-radius: 12px; margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <!-- 🚀 БАННЕРЫ -->
    <div class="ad-banner-container discord" id="discord-ad" onclick="openDiscordAd()">
        <button class="ad-close-btn" onclick="closeAd(event, 'discord-ad')">✕</button>
        <img class="ad-banner-img" src="./discord.png" alt="Discord Nitro">
    </div>

    <div class="ad-banner-container aviasales" id="aviasales-ad" onclick="openAviasalesAd()">
        <button class="ad-close-btn" onclick="closeAd(event, 'aviasales-ad')">✕</button>
        <img class="ad-banner-img" src="./aviasales.png" alt="Aviasales">
    </div>

    <!-- Вход / Ник -->
    <div class="modal-overlay" id="nickname-modal" style="display: none;">
        <div class="modal">
            <h2>Введите ник</h2>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">Лимит смены ника: 3 раза в день (Безлимитно для NITRO)</p>
            <input type="text" id="nickname-input" placeholder="Никнейм..." maxlength="15">
            <div id="modal-error" style="color: #ff4d4d; font-size: 0.8rem; display:none; margin-bottom: 5px;"></div>
            <button class="glow-button" style="width:100%; margin-top: 10px;" onclick="saveUsername()">Войти</button>
        </div>
    </div>

    <!-- ⚙️ МОДАЛЬНОЕ ОКНО НАСТРОЕК ПРОФИЛЯ -->
    <div class="modal-overlay" id="profile-modal" style="display: none;">
        <div class="modal">
            <h2>⚙️ Настройки Профиля</h2>
            
            <div id="profile-draft-warning" class="draft-notice">
                ⚠️ У вас есть несохраненные изменения! Нажмите <b>Применить</b> ниже.
            </div>

            <div style="margin-top: 15px;">
                <div class="profile-card">
                    <div class="profile-banner" id="my-profile-banner-preview"></div>
                    <div class="profile-avatar-container">
                        <img class="profile-avatar frame-none" id="my-profile-avatar-preview" src="https://via.placeholder.com/80" alt="Avatar">
                    </div>
                    <div class="profile-info">
                        <div class="profile-username" id="my-profile-name"></div>
                        <div class="profile-bio" id="my-profile-bio-preview">О себе не указано</div>
                    </div>
                </div>

                <!-- ⭐ Украшения & Кастомизация Nitro -->
                <div id="nitro-profile-settings" style="display: none; margin-top: 15px; text-align: left;">
                    <span style="font-size: 0.85rem; color: #ff007f; font-weight: bold;">⭐ Кастомизация Nitro:</span>
                    
                    <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-top: 8px;">О себе (Описание):</label>
                    <textarea id="my-bio-input" maxlength="100" placeholder="Расскажите о себе..." oninput="updateLivePreview()"></textarea>
                    
                    <label style="font-size: 0.75rem; color: var(--text-muted); display: block;">Шрифт текста и ника:</label>
                    <select id="my-font-input" onchange="updateLivePreview()">
                        <option value="Roboto">Стандартный (Roboto)</option>
                        <option value="Montserrat">Montserrat (Современный)</option>
                        <option value="Orbitron">Orbitron (Киберпанк/Неон)</option>
                        <option value="Pacifico">Pacifico (Рукописный)</option>
                        <option value="Press Start 2P">Press Start 2P (Ретро 8-bit)</option>
                        <option value="Dancing Script">Dancing Script (Изящный)</option>
                    </select>

                    <label style="font-size: 0.75rem; color: var(--text-muted); display: block;">Стиль перелива / цвета ника:</label>
                    <select id="my-color-type" onchange="toggleColorInput(this.value); updateLivePreview();">
                        <option value="default">Обычный (Голубой)</option>
                        <option value="custom">Статичный свой цвет</option>
                        <option value="rainbow">🌈 Радужный перелив</option>
                        <option value="neon">💎 Неоновый перелив</option>
                        <option value="fire">🔥 Огненный перелив</option>
                        <option value="sunset">🌅 Закат перелив</option>
                        <option value="custom-grad">🎨 Свой градиент (2 цвета)</option>
                    </select>

                    <!-- Выбор 1 цвета -->
                    <input type="color" id="my-color-picker" style="display:none; height: 35px; cursor:pointer;" value="#00f2fe" oninput="updateLivePreview()">

                    <!-- 🎨 Блок точной настройки Перелива -->
                    <div id="gradient-settings" class="gradient-controls" style="display: none;">
                        <div id="custom-grad-colors" style="display:none; gap: 10px; margin-bottom: 8px;">
                            <div>
                                <span style="font-size: 0.7rem; color: var(--text-muted);">Цвет 1:</span>
                                <input type="color" id="grad-color-1" value="#ff007f" style="height: 30px; margin: 2px 0;" oninput="updateLivePreview()">
                            </div>
                            <div>
                                <span style="font-size: 0.7rem; color: var(--text-muted);">Цвет 2:</span>
                                <input type="color" id="grad-color-2" value="#00f2fe" style="height: 30px; margin: 2px 0;" oninput="updateLivePreview()">
                            </div>
                        </div>

                        <label style="font-size: 0.7rem; color: var(--text-muted); display: block;">Скорость перелива: <span id="speed-val">3s</span></label>
                        <input type="range" id="grad-speed-input" min="1" max="10" step="0.5" value="3" style="margin: 2px 0 8px 0;" oninput="document.getElementById('speed-val').innerText = this.value + 's'; updateLivePreview();">

                        <label style="font-size: 0.7rem; color: var(--text-muted); display: block;">Угол перелива: <span id="angle-val">90°</span></label>
                        <input type="range" id="grad-angle-input" min="0" max="360" step="15" value="90" style="margin: 2px 0;" oninput="document.getElementById('angle-val').innerText = this.value + '°'; updateLivePreview();">
                    </div>

                    <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-top: 8px;">Рамка аватарки:</label>
                    <select id="my-frame-input" onchange="updateLivePreview()">
                        <option value="frame-none">Без рамки</option>
                        <option value="frame-neon">💎 Неоновый свет</option>
                        <option value="frame-rainbow">🌈 Переливающаяся рамка</option>
                        <option value="frame-fire">🔥 Огненная аура</option>
                        <option value="frame-gold">👑 Золотой блеск</option>
                    </select>

                    <label style="font-size: 0.75rem; color: var(--text-muted); display: block;">Аватарка (До 1 МБ):</label>
                    <input type="file" accept="image/*" onchange="uploadAvatar(event)">

                    <label style="font-size: 0.75rem; color: var(--text-muted); display: block;">Баннер профиля (До 1.5 МБ):</label>
                    <input type="file" accept="image/*" onchange="uploadBanner(event)">
                </div>

                <div id="no-nitro-profile-notice" style="display: block; margin-top: 15px; color: var(--text-muted); font-size: 0.8rem;">
                    🔒 Изменение стилей, шрифтов и переливов доступно только владельцам <b style="color:#ff007f;">Nitro</b>.
                </div>
            </div>

            <!-- ✨ КНОПКА ПРИМЕНИТЬ -->
            <button class="btn-apply" id="apply-changes-btn" onclick="saveNitroStyle()">✨ Применить изменения</button>
            
            <button class="btn-small" style="width:100%; margin-top: 15px;" onclick="closeProfile()">Закрыть</button>
        </div>
    </div>

    <!-- ЧАТ -->
    <div class="chat-container">
        <div class="chat-header">
            <div>
                <span>💬 ЧАТ</span>
                <span id="user-display" style="font-size: 0.85rem; color: var(--accent-primary); margin-left: 10px;"></span>
                <button class="btn-small" onclick="openProfile()" style="margin-left: 8px;">⚙️ Настройки</button>
            </div>
            <div style="display: flex; gap: 5px;">
                <button class="btn-nitro" id="buy-nitro-btn" onclick="requestNitro()">⭐ Nitro</button>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input-area" id="input-area">
            <button class="btn-emoji-icon" onclick="toggleEmojiPicker()">
                <img src="./emoji-icon.png" alt="Emoji">
            </button>
            <input type="text" id="message-input" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="glow-button" id="send-btn" onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxcjoPs5nfVrCyXs21EJZXscQ51txvAGU",
            authDomain: "chat-app-7530d.firebaseapp.com",
            databaseURL: "https://chat-app-7530d-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "chat-app-7530d",
            storageBucket: "chat-app-7530d.firebasestorage.app",
            messagingSenderId: "892413271650",
            appId: "1:892413271650:web:5dc718cf2748d724c7bb3b"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const messagesRef = database.ref('messages');
        const userProfilesRef = database.ref('user_profiles');
        const nitroRef = database.ref('nitro_users');

        let currentUser = localStorage.getItem('chat_username') || "";
        let isNitroUser = false;
        let hasUnsavedProfileChanges = false;
        let cachedProfiles = {};

        window.onload = function() {
            if (!currentUser) {
                document.getElementById('nickname-modal').style.display = 'flex';
            } else {
                initChat();
            }
        };

        function initChat() {
            document.getElementById('user-display').innerText = `@${currentUser}`;
            checkNitroStatus();
            listenForProfiles();
            listenForMessages();
        }

        function checkNitroStatus() {
            nitroRef.child(currentUser.toLowerCase()).on('value', (snap) => {
                isNitroUser = snap.exists() && snap.val() === true;
                document.getElementById('nitro-profile-settings').style.display = isNitroUser ? "block" : "none";
                document.getElementById('no-nitro-profile-notice').style.display = isNitroUser ? "none" : "block";
                renderUserProfilePreview();
            });
        }

        function listenForProfiles() {
            userProfilesRef.on('value', (snap) => {
                cachedProfiles = snap.val() || {};
                renderUserProfilePreview();
            });
        }

        function openProfile() {
            hasUnsavedProfileChanges = false;
            document.getElementById('profile-draft-warning').style.display = 'none';
            document.getElementById('apply-changes-btn').style.display = 'none';
            renderUserProfilePreview();
            document.getElementById('profile-modal').style.display = 'flex';
        }

        function closeProfile() {
            if (hasUnsavedProfileChanges && !confirm("Есть несохраненные изменения! Закрыть?")) return;
            hasUnsavedProfileChanges = false;
            document.getElementById('profile-modal').style.display = 'none';
        }

        function toggleColorInput(val) {
            const picker = document.getElementById('my-color-picker');
            const gradSettings = document.getElementById('gradient-settings');
            const customGradColors = document.getElementById('custom-grad-colors');

            picker.style.display = val === 'custom' ? 'block' : 'none';
            gradSettings.style.display = ['rainbow', 'neon', 'fire', 'sunset', 'custom-grad'].includes(val) ? 'block' : 'none';
            customGradColors.style.display = val === 'custom-grad' ? 'flex' : 'none';
        }

        /* ✨ Генерация перелива по настройкам */
        function getGradientCSS(type, color1, color2, angle) {
            switch(type) {
                case 'rainbow': return `linear-gradient(${angle}deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff)`;
                case 'neon': return `linear-gradient(${angle}deg, #00f2fe, #4facfe, #00c853, #00f2fe)`;
                case 'fire': return `linear-gradient(${angle}deg, #ff4e00, #ec9f05, #ff0000, #ff4e00)`;
                case 'sunset': return `linear-gradient(${angle}deg, #ff0844, #ffb199, #ff007f)`;
                case 'custom-grad': return `linear-gradient(${angle}deg, ${color1}, ${color2})`;
                default: return '';
            }
        }

        function updateLivePreview() {
            hasUnsavedProfileChanges = true;
            document.getElementById('profile-draft-warning').style.display = 'block';
            document.getElementById('apply-changes-btn').style.display = 'block';

            const bioVal = document.getElementById('my-bio-input').value.trim();
            const fontVal = document.getElementById('my-font-input').value;
            const frameVal = document.getElementById('my-frame-input').value;
            const colorType = document.getElementById('my-color-type').value;
            const colorVal = document.getElementById('my-color-picker').value;

            const c1 = document.getElementById('grad-color-1').value;
            const c2 = document.getElementById('grad-color-2').value;
            const speed = document.getElementById('grad-speed-input').value + 's';
            const angle = document.getElementById('grad-angle-input').value + 'deg';

            const nameDiv = document.getElementById('my-profile-name');
            const bioDiv = document.getElementById('my-profile-bio-preview');
            const avatarImg = document.getElementById('my-profile-avatar-preview');

            avatarImg.className = `profile-avatar ${frameVal}`;
            
            let nameStyle = `font-family: '${fontVal}', sans-serif;`;
            let nameClass = "";

            if (colorType === 'custom') {
                nameStyle += `color: ${colorVal};`;
            } else if (colorType !== 'default') {
                nameClass = "gradient-text";
                const gradCSS = getGradientCSS(colorType, c1, c2, parseFloat(angle));
                nameStyle += `background: ${gradCSS}; --grad-speed: ${speed};`;
            }

            let badge = isNitroUser ? `<span class="nitro-badge">NITRO</span>` : '';
            nameDiv.innerHTML = `<span class="${nameClass}" style="${nameStyle}">@${currentUser}</span> ${badge}`;
            bioDiv.innerText = bioVal || "О себе не указано";
        }

        function saveNitroStyle() {
            if (!isNitroUser) return;
            
            userProfilesRef.child(currentUser.toLowerCase()).update({
                bio: document.getElementById('my-bio-input').value.trim(),
                font: document.getElementById('my-font-input').value,
                frame: document.getElementById('my-frame-input').value,
                colorType: document.getElementById('my-color-type').value,
                colorVal: document.getElementById('my-color-picker').value,
                gradColor1: document.getElementById('grad-color-1').value,
                gradColor2: document.getElementById('grad-color-2').value,
                gradSpeed: document.getElementById('grad-speed-input').value,
                gradAngle: document.getElementById('grad-angle-input').value
            }).then(() => {
                hasUnsavedProfileChanges = false;
                document.getElementById('profile-draft-warning').style.display = 'none';
                document.getElementById('apply-changes-btn').style.display = 'none';
                alert("✨ Настройки перелива и стиля сохранены!");
            });
        }

        function renderUserProfilePreview() {
            const prof = cachedProfiles[currentUser.toLowerCase()] || {};
            const nameDiv = document.getElementById('my-profile-name');
            const bioDiv = document.getElementById('my-profile-bio-preview');
            const avatarImg = document.getElementById('my-profile-avatar-preview');

            avatarImg.src = prof.avatar || "https://via.placeholder.com/80";
            avatarImg.className = `profile-avatar ${prof.frame || 'frame-none'}`;

            let nameStyle = `font-family: '${prof.font || 'Roboto'}', sans-serif;`;
            let nameClass = "";

            if (prof.colorType === 'custom') {
                nameStyle += `color: ${prof.colorVal};`;
            } else if (prof.colorType && prof.colorType !== 'default') {
                nameClass = "gradient-text";
                const gradCSS = getGradientCSS(prof.colorType, prof.gradColor1, prof.gradColor2, prof.gradAngle || 90);
                nameStyle += `background: ${gradCSS}; --grad-speed: ${prof.gradSpeed || 3}s;`;
            }

            let badge = isNitroUser ? `<span class="nitro-badge">NITRO</span>` : '';
            nameDiv.innerHTML = `<span class="${nameClass}" style="${nameStyle}">@${currentUser}</span> ${badge}`;
            bioDiv.innerText = prof.bio || "О себе не указано";
        }

        function saveUsername() {
            const name = document.getElementById('nickname-input').value.trim();
            if (name.length >= 3) {
                currentUser = name;
                localStorage.setItem('chat_username', name);
                document.getElementById('nickname-modal').style.display = 'none';
                initChat();
            }
        }
    </script>
</body>
</html>
