<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-chat: rgba(22, 22, 26, 0.85);
            --bg-input: rgba(45, 45, 52, 0.9);
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --accent-primary: #00f2fe;
            --accent-secondary: #4facfe;
            --btn-glow: 0 0 15px rgba(0, 242, 254, 0.6);
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #050505;
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .glow-button {
            background: linear-gradient(45deg, var(--accent-secondary), var(--accent-primary));
            color: #000; border: none; border-radius: 20px;
            cursor: pointer; font-weight: bold; padding: 10px 20px;
            transition: all 0.3s ease; box-shadow: var(--btn-glow);
        }

        .glow-button:disabled {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-small {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color); color: var(--text-main);
            padding: 5px 10px; border-radius: 12px; cursor: pointer; font-size: 0.8rem;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal {
            background: var(--bg-chat); padding: 25px; border-radius: 16px;
            width: 380px; border: 1px solid var(--border-color); text-align: center;
            max-height: 90vh; overflow-y: auto;
        }

        .modal input, .modal select {
            width: 100%; padding: 10px; margin: 6px 0;
            border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-input); color: #fff; outline: none;
        }

        .chat-container {
            width: 100%; max-width: 750px; height: 90vh;
            background: var(--bg-chat); backdrop-filter: blur(12px);
            border-radius: 20px; display: flex; flex-direction: column;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .chat-header {
            padding: 15px 20px; background: rgba(15, 15, 20, 0.7);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-messages {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
        }

        .message {
            max-width: 75%; padding: 10px 14px; border-radius: 14px;
            background: var(--bg-input); align-self: flex-start;
            word-wrap: break-word; border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .message.my-message {
            background: linear-gradient(135deg, rgba(45,45,55,0.9), rgba(20,25,35,0.9));
            align-self: flex-end; border: 1px solid rgba(0, 242, 254, 0.4);
        }

        .message .username { font-size: 0.75rem; font-weight: bold; color: var(--accent-primary); margin-bottom: 4px; }
        .message-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 5px; cursor: pointer; }
        .message-file { display: inline-block; padding: 6px 10px; background: rgba(255,255,255,0.1); border-radius: 6px; color: var(--accent-primary); text-decoration: none; font-size: 0.85rem; margin-top: 5px; }

        .chat-input-area {
            padding: 15px; background: rgba(15, 15, 20, 0.8);
            border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center;
            position: relative;
        }

        .chat-input-area input[type="text"] {
            flex: 1; padding: 10px 15px; border-radius: 20px;
            border: 1px solid var(--border-color); background: var(--bg-input); color: #fff; outline: none;
        }

        .emoji-picker {
            position: absolute; bottom: 65px; left: 15px; background: #1a1a20;
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 10px; display: none; grid-template-columns: repeat(6, 1fr); gap: 8px;
            z-index: 100; max-height: 180px; overflow-y: auto;
        }

        .emoji-picker span { cursor: pointer; font-size: 1.3rem; text-align: center; transition: transform 0.1s; }
        .emoji-picker span:hover { transform: scale(1.2); }

        .admin-panel { display: flex; flex-direction: column; gap: 10px; text-align: left; }

        /* 😱 Экран Скримера на весь экран */
        #screamer-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 99999; display: none;
            justify-content: center; align-items: center;
        }
        #screamer-overlay img {
            width: 100%; height: 100%; object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Аудио элементы -->
    <audio id="abuse-audio" src="music.mp3"></audio>
    <audio id="stream-audio" autoplay></audio>
    <audio id="screamer-audio"></audio>

    <!-- Окно Полноэкранного Скримера -->
    <div id="screamer-overlay">
        <img id="screamer-img" src="" alt="Screamer">
    </div>

    <!-- Вход / Ввод ника -->
    <div class="modal-overlay" id="nickname-modal" style="display: none;">
        <div class="modal">
            <h2>Введите ник</h2>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">Лимит смены ника: 3 раза в день</p>
            <input type="text" id="nickname-input" placeholder="Никнейм..." maxlength="15">
            <div id="modal-error" style="color: #ff4d4d; font-size: 0.8rem; display:none; margin-bottom: 5px;"></div>
            <button class="glow-button" style="width:100%; margin-top: 10px;" onclick="saveUsername()">Войти</button>
        </div>
    </div>

    <!-- 👑 Главная Админ Панель -->
    <div class="modal-overlay" id="admin-modal" style="display: none;">
        <div class="modal">
            <h2>👑 Панель Администратора</h2>
            <div class="admin-panel" style="margin-top: 15px;">
                <button class="btn-small" style="background: linear-gradient(45deg, #ff0055, #ff5000); padding: 10px; font-weight: bold;" onclick="toggleAbuseMusic()">💥 АДМИН АБЬЮЗ (Файл music.mp3)</button>

                <button class="btn-small" style="background: linear-gradient(45deg, #8e2de2, #4a00e0); padding: 10px; font-weight: bold;" onclick="openScreamerMenu()">😱 ОТПРАВИТЬ СКРИМЕР</button>
                
                <hr style="border-color: var(--border-color); margin: 5px 0;">
                
                <span style="font-size: 0.85rem; color: var(--accent-primary); font-weight: bold;">🎵 Звук / Музыка по ссылке (всем):</span>
                <input type="text" id="audio-link-input" placeholder="Ссылка на MP3 или аудиопоток...">
                <div style="display: flex; gap: 5px;">
                    <button class="btn-small" style="background:#00c853; flex:1;" onclick="playAudioUrl()">🔊 Включить всем</button>
                    <button class="btn-small" style="background:#d50000; flex:1;" onclick="stopAudioUrl()">🔇 Выключить</button>
                </div>

                <hr style="border-color: var(--border-color); margin: 5px 0;">
                
                <input type="text" id="target-user" placeholder="Ник пользователя...">
                
                <div style="display: flex; gap: 5px;">
                    <button class="btn-small" style="background:#9c27b0; flex:1;" onclick="addAdmin()">⭐ Выдать Админку</button>
                    <button class="btn-small" style="background:#607d8b; flex:1;" onclick="removeAdmin()">❌ Снять Админку</button>
                </div>

                <button class="btn-small" style="background:#ff4d4d;" onclick="banUser()">🚫 Забанить</button>
                <button class="btn-small" style="background:#4caf50;" onclick="unbanUser()">🔓 Разбанить</button>
                <button class="btn-small" style="background:#2196f3;" onclick="allowNickChange()">🔄 Сбросить лимит ников человеку</button>
                <hr style="border-color: var(--border-color); margin: 5px 0;">
                <button class="btn-small" style="background:#e91e63; width:100%;" onclick="clearAllMessages()">🗑️ Очистить весь чат</button>
            </div>
            <button class="btn-small" style="width:100%; margin-top: 15px;" onclick="closeAdmin()">Закрыть</button>
        </div>
    </div>

    <!-- 😱 ОКНО НАСТРОЙКИ СКРИМЕРА -->
    <div class="modal-overlay" id="screamer-modal" style="display: none; z-index: 1001;">
        <div class="modal">
            <h2>😱 Настройка Скримера</h2>
            <div style="text-align: left; margin-top: 10px; font-size: 0.85rem;">
                
                <label style="color: var(--accent-primary); font-weight: bold;">1. Жертва (Никнейм или 'ALL'):</label>
                <input type="text" id="screamer-target" placeholder="Введите ник или ALL для всех">

                <label style="color: var(--accent-primary); font-weight: bold;">2. Шаблон картинки/гифки:</label>
                <select id="screamer-preset" onchange="applyScreamerPreset()">
                    <option value="https://i.postimg.cc/mD8N1Csh/screamer1.gif">👻 Страшное Лицо (Рабочая GIF)</option>
                    <option value="https://i.postimg.cc/PJ2T210B/screamer2.gif">👺 Монстр (Рабочая GIF)</option>
                    <option value="https://i.postimg.cc/44C5X658/screamer3.jpg">👹 Крик (Фото)</option>
                    <option value="custom">-- Ввести свою ссылку --</option>
                </select>

                <label style="color: var(--accent-primary); font-weight: bold;">Прямая ссылка на GIF/Фото:</label>
                <input type="text" id="screamer-img-url" value="https://i.postimg.cc/mD8N1Csh/screamer1.gif" placeholder="https://site.com/image.gif">

                <label style="color: var(--accent-primary); font-weight: bold;">Ссылка на Звук (MP3):</label>
                <input type="text" id="screamer-audio-url" value="https://www.myinstants.com/media/sounds/screamer.mp3" placeholder="Ссылка на mp3 крик">

                <label style="color: var(--accent-primary); font-weight: bold;">Длительность (в секундах):</label>
                <input type="number" id="screamer-duration" value="3" min="1" max="10">

                <button class="glow-button" style="width:100%; margin-top: 10px; background: linear-gradient(45deg, #ff0055, #ff5000); color:#fff;" onclick="sendScreamer()">💥 ОТПРАВИТЬ СКРИМЕР</button>
                <button class="btn-small" style="width:100%; margin-top: 8px;" onclick="closeScreamerMenu()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Главный Чат -->
    <div class="chat-container">
        <div class="chat-header">
            <div>
                <span>💬 ЧАТ</span>
                <span id="user-display" style="font-size: 0.85rem; color: var(--accent-primary); margin-left: 10px;"></span>
                <button class="btn-small" onclick="promptChangeNick()" style="margin-left: 5px;">✏️</button>
            </div>
            <div>
                <button class="btn-small" id="admin-btn" style="display: none; background: linear-gradient(45deg, #ff007f, #7928ca);" onclick="openAdmin()">👑 Админка</button>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <!-- Панель Эмодзи -->
        <div class="emoji-picker" id="emoji-picker">
            <span onclick="addEmoji('😀')">😀</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('😍')">😍</span>
            <span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('😭')">😭</span><span onclick="addEmoji('🔥')">🔥</span>
            <span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('🎉')">🎉</span>
            <span onclick="addEmoji('💩')">💩</span><span onclick="addEmoji('💀')">💀</span><span onclick="addEmoji('🤡')">🤡</span>
            <span onclick="addEmoji('🤔')">🤔</span><span onclick="addEmoji('😡')">😡</span><span onclick="addEmoji('👀')">👀</span>
            <span onclick="addEmoji('🚀')">🚀</span><span onclick="addEmoji('✨')">✨</span><span onclick="addEmoji('💯')">💯</span>
        </div>

        <div class="chat-input-area">
            <button class="btn-small" onclick="toggleEmojiPicker()" style="font-size: 1.1rem; padding: 6px 10px;">😀</button>
            
            <label class="btn-small" style="font-size: 1.1rem; padding: 6px 10px; cursor: pointer;" title="Отправить картинку или файл">
                📎
                <input type="file" id="file-input" style="display: none;" onchange="sendFile(event)">
            </label>

            <input type="text" id="message-input" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="glow-button" id="send-btn" onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxcjoPs5nfVrCyXs21EJZXscQ51txvAGU",
            authDomain: "chat-app-7530d.firebaseapp.com",
            databaseURL: "https://chat-app-7530d-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "chat-app-7530d",
            storageBucket: "chat-app-7530d.firebasestorage.app",
            messagingSenderId: "892413271650",
            appId: "1:892413271650:web:5dc718cf2748d724c7bb3b"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const messagesRef = database.ref('messages');
        const bansRef = database.ref('bans');
        const resetNickRef = database.ref('resetNickRequests');
        const usersRef = database.ref('users');
        const musicRef = database.ref('admin_music');
        const adminsRef = database.ref('admins');
        const audioStreamRef = database.ref('admin_audio_stream');
        const screamerRef = database.ref('screamer_trigger');

        const MAIN_ADMIN = "Anton"; 

        let currentUser = localStorage.getItem('chat_username') || "";
        let isCooldown = false;
        let nickHistory = JSON.parse(localStorage.getItem('chat_nick_history') || "[]");

        window.onload = function() {
            if (!currentUser) {
                document.getElementById('nickname-modal').style.display = 'flex';
            } else {
                initChat();
            }
        };

        function checkNickLimit() {
            const now = Date.now();
            const ONE_DAY = 24 * 60 * 60 * 1000;
            nickHistory = nickHistory.filter(time => now - time < ONE_DAY);
            localStorage.setItem('chat_nick_history', JSON.stringify(nickHistory));
            return nickHistory.length < 3;
        }

        async function saveUsername() {
            const input = document.getElementById('nickname-input');
            const name = input.value.trim();

            if (name.length < 3 || name.length > 15) {
                showError("Ник от 3 до 15 символов!");
                return;
            }

            if (currentUser && currentUser !== name && !checkNickLimit()) {
                showError("⚠️ Достигнут лимит: сменить ник можно только 3 раза в день!");
                return;
            }

            const userCheck = await usersRef.child(name.toLowerCase()).once('value');
            if (userCheck.exists() && userCheck.val() !== currentUser) {
                showError("⚠️ Этот ник уже занят!");
                return;
            }

            if (currentUser && currentUser !== name) {
                usersRef.child(currentUser.toLowerCase()).remove();
                nickHistory.push(Date.now());
                localStorage.setItem('chat_nick_history', JSON.stringify(nickHistory));
            }

            currentUser = name;
            usersRef.child(currentUser.toLowerCase()).set(true);
            localStorage.setItem('chat_username', currentUser);

            document.getElementById('nickname-modal').style.display = 'none';
            initChat();
        }

        function promptChangeNick() {
            if (!checkNickLimit()) {
                alert("❌ Вы использовали все 3 попытки смены ника за день! Попробуйте позже.");
                return;
            }
            document.getElementById('nickname-input').value = currentUser;
            document.getElementById('nickname-modal').style.display = 'flex';
        }

        function initChat() {
            document.getElementById('user-display').innerText = `@${currentUser}`;
            checkAdminRights();

            listenForMessages();
            listenForAdminResets();
            listenForMusic();
            listenForAudioStream();
            listenForScreamers();
        }

        function checkAdminRights() {
            if (currentUser.toLowerCase() === MAIN_ADMIN.toLowerCase()) {
                document.getElementById('admin-btn').style.display = 'inline-block';
                return;
            }

            adminsRef.child(currentUser.toLowerCase()).on('value', (snapshot) => {
                if (snapshot.exists() && snapshot.val() === true) {
                    document.getElementById('admin-btn').style.display = 'inline-block';
                } else {
                    document.getElementById('admin-btn').style.display = 'none';
                }
            });
        }

        function showError(msg) {
            const err = document.getElementById('modal-error');
            err.innerText = msg;
            err.style.display = 'block';
        }

        function toggleEmojiPicker() {
            const picker = document.getElementById('emoji-picker');
            picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
        }

        function addEmoji(emoji) {
            const input = document.getElementById('message-input');
            input.value += emoji;
            toggleEmojiPicker();
            input.focus();
        }

        async function sendMessage(fileData = null) {
            if (isCooldown) return;

            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text && !fileData) return;

            const banSnapshot = await bansRef.child(currentUser).once('value');
            if (banSnapshot.exists() && banSnapshot.val() === true) {
                alert("❌ Вы забанены администратором!");
                return;
            }

            const msgObj = {
                user: currentUser,
                text: text,
                timestamp: Date.now()
            };

            if (fileData) {
                msgObj.file = fileData.url;
                msgObj.fileType = fileData.type;
                msgObj.fileName = fileData.name;
            }

            messagesRef.push(msgObj);

            input.value = '';
            startCooldown(3);
        }

        function sendFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 3 * 1024 * 1024) {
                alert("⚠️ Файл слишком большой! Выберите файл размером до 3 МБ.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const fileType = file.type.startsWith('image/') ? 'image' : 'file';
                sendMessage({
                    url: e.target.result,
                    type: fileType,
                    name: file.name
                });
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function startCooldown(seconds) {
            isCooldown = true;
            const btn = document.getElementById('send-btn');
            btn.disabled = true;

            let timeLeft = seconds;
            btn.innerText = `${timeLeft}s`;

            const interval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    btn.innerText = `${timeLeft}s`;
                } else {
                    clearInterval(interval);
                    btn.disabled = false;
                    btn.innerText = 'Отправить';
                    isCooldown = false;
                }
            }, 1000);
        }

        function listenForMessages() {
            messagesRef.limitToLast(50).on('value', (snapshot) => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                snapshot.forEach((child) => {
                    const data = child.val();
                    renderMessage(data);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function renderMessage(data) {
            const container = document.getElementById('chat-messages');
            const isMy = data.user === currentUser;
            const div = document.createElement('div');
            div.className = `message ${isMy ? 'my-message' : ''}`;
            
            let html = `<div class="username">${data.user}</div>`;
            if (data.text) {
                html += `<div>${data.text}</div>`;
            }
            if (data.file) {
                if (data.fileType === 'image') {
                    html += `<img src="${data.file}" class="message-img" onclick="window.open('${data.file}')">`;
                } else {
                    html += `<a href="${data.file}" download="${data.fileName}" class="message-file">📄 ${data.fileName}</a>`;
                }
            }

            div.innerHTML = html;
            container.appendChild(div);
        }

        // --- 👑 АДМИН ПАНЕЛЬ ---
        function openAdmin() {
            document.getElementById('admin-modal').style.display = 'flex';
        }

        function closeAdmin() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        async function toggleAbuseMusic() {
            const snap = await musicRef.once('value');
            const isPlaying = snap.val();
            musicRef.set(!isPlaying);
        }

        function listenForMusic() {
            const audio = document.getElementById('abuse-audio');
            musicRef.on('value', (snapshot) => {
                const shouldPlay = snapshot.val();
                if (shouldPlay) {
                    audio.play().catch(e => console.log("Кликните на страницу"));
                } else {
                    audio.pause();
                    audio.currentTime = 0;
                }
            });
        }

        function playAudioUrl() {
            const url = document.getElementById('audio-link-input').value.trim();
            if (!url) {
                alert("Вставьте ссылку!");
                return;
            }
            audioStreamRef.set({ url: url, timestamp: Date.now() });
            closeAdmin();
        }

        function stopAudioUrl() {
            audioStreamRef.remove();
            alert("Аудио выключено!");
        }

        function listenForAudioStream() {
            const streamAudio = document.getElementById('stream-audio');
            audioStreamRef.on('value', (snapshot) => {
                if (!snapshot.exists()) {
                    streamAudio.pause();
                    streamAudio.src = "";
                    return;
                }
                const data = snapshot.val();
                if (streamAudio.src !== data.url) {
                    streamAudio.src = data.url;
                    streamAudio.play().catch(e => console.log("Кликните по экрану для звука"));
                }
            });
        }

        // --- 😱 ИСПРАВЛЕННЫЙ СКРИМЕР ---
        function openScreamerMenu() {
            const target = document.getElementById('target-user').value.trim();
            if (target) {
                document.getElementById('screamer-target').value = target;
            }
            closeAdmin();
            document.getElementById('screamer-modal').style.display = 'flex';
        }

        function closeScreamerMenu() {
            document.getElementById('screamer-modal').style.display = 'none';
        }

        function applyScreamerPreset() {
            const select = document.getElementById('screamer-preset');
            if (select.value !== 'custom') {
                document.getElementById('screamer-img-url').value = select.value;
            }
        }

        function sendScreamer() {
            const target = document.getElementById('screamer-target').value.trim();
            const imgUrl = document.getElementById('screamer-img-url').value.trim();
            const audioUrl = document.getElementById('screamer-audio-url').value.trim();
            const duration = parseInt(document.getElementById('screamer-duration').value) || 3;

            if (!target) {
                alert("Укажите ник жертвы или 'ALL'");
                return;
            }
            if (!imgUrl) {
                alert("Укажите ссылку на картинку или GIF!");
                return;
            }

            screamerRef.set({
                target: target.toLowerCase(),
                img: imgUrl,
                audio: audioUrl,
                duration: duration,
                id: Date.now()
            });

            alert(`😱 Скример отправлен пользователю (${target})!`);
            closeScreamerMenu();
        }

        function listenForScreamers() {
            screamerRef.on('value', (snapshot) => {
                if (!snapshot.exists()) return;
                const data = snapshot.val();

                if (data.target === 'all' || data.target === currentUser.toLowerCase()) {
                    triggerScreamerEffect(data.img, data.audio, data.duration);
                }
            });
        }

        function triggerScreamerEffect(imgUrl, audioUrl, duration) {
            const overlay = document.getElementById('screamer-overlay');
            const img = document.getElementById('screamer-img');
            const audio = document.getElementById('screamer-audio');

            // Принудительно перезагружаем картинку (добавляем timestamp для обхода кэша)
            const cleanUrl = imgUrl.includes('?') ? imgUrl + '&t=' + Date.now() : imgUrl + '?t=' + Date.now();
            img.src = cleanUrl;
            
            overlay.style.display = 'flex';

            if (audioUrl) {
                audio.src = audioUrl;
                audio.play().catch(e => console.log("Автовоспроизведение заблокировано"));
            }

            setTimeout(() => {
                overlay.style.display = 'none';
                img.src = '';
                audio.pause();
                audio.currentTime = 0;
            }, duration * 1000);
        }

        function addAdmin() {
            const user = document.getElementById('target-user').value.trim();
            if (user) {
                adminsRef.child(user.toLowerCase()).set(true);
                alert(`⭐ Пользователь ${user} теперь Администратор!`);
            }
        }

        function removeAdmin() {
            const user = document.getElementById('target-user').value.trim();
            if (user) {
                if (user.toLowerCase() === MAIN_ADMIN.toLowerCase()) {
                    alert("❌ Нельзя снять права у Главного Администратора!");
                    return;
                }
                adminsRef.child(user.toLowerCase()).remove();
                alert(`❌ Пользователь ${user} больше не Администратор.`);
            }
        }

        function banUser() {
            const user = document.getElementById('target-user').value.trim();
            if (user) {
                bansRef.child(user).set(true);
                alert(`Пользователь ${user} забанен!`);
            }
        }

        function unbanUser() {
            const user = document.getElementById('target-user').value.trim();
            if (user) {
                bansRef.child(user).remove();
                alert(`Пользователь ${user} разбанен!`);
            }
        }

        function allowNickChange() {
            const user = document.getElementById('target-user').value.trim();
            if (user) {
                resetNickRef.child(user).set(Date.now());
                alert(`Лимит попыток ника для ${user} сброшен!`);
            }
        }

        function clearAllMessages() {
            if (confirm("Удалить ВСЕ сообщения в чате?")) {
                messagesRef.remove();
            }
        }

        function listenForAdminResets() {
            resetNickRef.child(currentUser).on('value', (snapshot) => {
                if (snapshot.exists()) {
                    localStorage.setItem('chat_nick_history', "[]");
                    nickHistory = [];
                    alert("🎉 Админ сбросил ваш дневной лимит смены ника!");
                    resetNickRef.child(currentUser).remove();
                }
            });
        }
    </script>
</body>
</html>
